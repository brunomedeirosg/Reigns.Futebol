<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CRAQUE</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;-webkit-tap-highlight-color:transparent}
body{
  font-family:"Inter","Segoe UI",system-ui,-apple-system,sans-serif;
  background:var(--fundo);color:var(--texto);
  display:flex;align-items:center;justify-content:center;
  transition:background .8s ease;user-select:none;
}
#palco{width:min(100vw,430px);height:min(100vh,860px);position:relative;display:flex;flex-direction:column;padding:14px}

/* ---------- identidade: nome sempre, título quando conquistado ---------- */
#identidade{display:flex;align-items:baseline;justify-content:center;gap:9px;
  padding:2px 2px 6px;min-height:19px;flex-wrap:wrap}
#identidade .quem-eu{font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--texto2);opacity:.8}
#identidade .titulo{font-size:13px;font-weight:750;letter-spacing:.05em;color:var(--texto);
  padding:1px 9px;border:1.5px solid var(--texto);border-radius:99px;line-height:1.35}
#identidade .titulo{white-space:nowrap}
#identidade.revela .titulo{animation:selo 1400ms cubic-bezier(.2,1,.3,1)}
@keyframes selo{
  0%{opacity:0;transform:translateY(-7px);box-shadow:0 0 0 0 var(--texto)}
  22%{opacity:1;transform:translateY(0);box-shadow:0 0 0 7px rgba(255,255,255,0)}
  55%{box-shadow:0 0 22px 2px var(--texto)}
  100%{opacity:1;transform:none;box-shadow:none}
}

/* ---------- medidores ---------- */
#medidores{display:flex;gap:10px;padding:2px 2px 14px}
.med{position:relative}
.med{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;transition:transform .18s ease}
.med svg{width:22px;height:22px;display:block;transition:opacity .18s,transform .18s}
/* bolinha de impacto: aparece no arrasto e diz o TAMANHO da consequência.
   Nunca diz o sinal — nem por cor, nem por posição, nem por forma. */
.med .bola{width:14px;height:14px;border-radius:50%;opacity:0;transform:scale(0);
  transition:transform .14s cubic-bezier(.2,1.2,.3,1),opacity .14s ease;margin:-3px 0 -1px}
.med.imp1 .bola{transform:scale(.36);opacity:.9}
.med.imp2 .bola{transform:scale(.64);opacity:.95}
.med.imp3 .bola{transform:scale(1);opacity:1}
.med .trilho{width:100%;height:7px;border-radius:99px;background:rgba(0,0,0,.38);overflow:hidden;position:relative}
.med .fantasma{position:absolute;top:0;height:100%;border-radius:99px;opacity:0}
.med .fantasma.vivo{animation:some .75s ease-out forwards}
@keyframes some{0%{opacity:.75}70%{opacity:.45}100%{opacity:0}}
.med .barra{position:absolute;top:0;left:0;height:100%;border-radius:99px;
  transition:width .5s cubic-bezier(.2,.85,.25,1)}
.med.bateu .trilho{animation:sacode .34s cubic-bezier(.36,.07,.19,.97)}
@keyframes sacode{0%,100%{transform:translateX(0)}20%{transform:translateX(-3px)}
  45%{transform:translateX(3px)}70%{transform:translateX(-2px)}}
.med.subiu svg{animation:pulsa .5s ease-out}
.med.caiu svg{animation:pulsa .5s ease-out}
@keyframes pulsa{0%{transform:scale(1)}35%{transform:scale(1.45)}100%{transform:scale(1)}}
.med.forte svg{animation:pulsaForte .62s ease-out}
@keyframes pulsaForte{0%{transform:scale(1)}30%{transform:scale(1.9)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
.med.apagado svg{opacity:.32}
.med.aceso{transform:translateY(-3px)}
.med.aceso svg{opacity:1;transform:scale(1.18)}
.med.perigo .barra{animation:pisca .9s infinite}
@keyframes pisca{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes treme{0%,100%{transform:translateX(0)}25%{transform:translateX(-2px)}75%{transform:translateX(2px)}}

/* ---------- carta ---------- */
#area{flex:1;position:relative;display:flex;align-items:center;justify-content:center}
#carta{
  position:absolute;width:100%;max-width:320px;height:min(100%,500px);z-index:1;
  display:flex;flex-direction:column;
  background:var(--superficie);border:3px solid var(--traco);border-radius:18px;
  overflow:hidden;cursor:grab;box-shadow:0 18px 40px rgba(0,0,0,.45);
  will-change:transform;touch-action:none;
}
#carta.solta{transition:transform .32s cubic-bezier(.3,1.3,.5,1),opacity .32s}
#carta.saindo{transition:transform .3s ease-in,opacity .3s ease-in}
#retrato{width:100%;flex:1 1 auto;min-height:0;display:block;background:var(--fundo)}
#texto{flex:0 0 auto;padding:12px 18px 18px;font-size:15px;line-height:1.45}
#quem{flex:0 0 auto;padding:11px 18px 0;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--texto2);opacity:.85}

/* ---------- rótulos ---------- */
.rotulo{
  position:absolute;top:38%;z-index:6;font-size:15px;font-weight:700;letter-spacing:.01em;
  padding:9px 14px;border-radius:11px;border:2px solid var(--texto);
  background:var(--fundo);color:var(--texto);box-shadow:0 6px 18px rgba(0,0,0,.5);
  opacity:0;transition:opacity .14s;pointer-events:none;max-width:42%;line-height:1.25;
}
#rotE{left:0;transform:rotate(-7deg)}
#rotD{right:0;transform:rotate(7deg)}

/* ---------- rodapé ---------- */
#rodape{display:flex;justify-content:space-between;align-items:center;padding:12px 4px 4px;font-size:11.5px;color:var(--texto2);letter-spacing:.05em}
#dica{text-align:center;font-size:11px;color:var(--texto2);opacity:.55;padding-bottom:6px;height:16px}

/* ---------- balanço de fim de temporada ---------- */
#b-cabeca{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--texto2)}
#b-patamar{font-size:22px;font-weight:700;letter-spacing:.01em;margin-top:-6px}
#balanco .grade{display:flex;gap:26px;margin:4px 0 2px}
#balanco .cel{display:flex;flex-direction:column;align-items:center;gap:3px}
#balanco .cel b{font-size:27px;font-weight:700;line-height:1}
#balanco .cel span{font-size:9.5px;color:var(--texto2);letter-spacing:.08em;text-transform:uppercase}
#b-frase{font-size:16px;line-height:1.4;font-style:italic;max-width:22em;opacity:.92}

/* ---------- eco de legado: carta de texto, sem personagem ---------- */
/* Vira carta porque sussurro de 1,9s some antes de ser lido. Aqui o jogador
   controla o tempo: fica na tela até ele arrastar. Arrastar não decide nada —
   os dois lados fazem a mesma coisa, e é de propósito. */
#carta.so-texto{background:var(--fundo);border-style:solid;border-color:var(--texto2);
  align-items:center;justify-content:center;box-shadow:0 14px 34px rgba(0,0,0,.4)}
#carta.so-texto #eco-texto{
  padding:0 30px;text-align:center;font-size:21px;line-height:1.42;
  font-style:italic;letter-spacing:.01em;color:var(--texto);max-width:15em;
}
#carta.so-texto #eco-marca{
  position:absolute;bottom:22px;left:0;right:0;text-align:center;
  font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--texto2);opacity:.5;
}
#carta.so-texto.entrando{animation:ecoEntra .42s cubic-bezier(.2,.9,.3,1)}
@keyframes ecoEntra{0%{opacity:0;transform:scale(.96)}100%{opacity:1;transform:scale(1)}}

/* ---------- telas ---------- */
.tela{position:absolute;inset:0;background:var(--fundo);display:flex;flex-direction:column;
  align-items:center;justify-content:center;padding:22px;text-align:center;z-index:20;gap:15px}
.tela.oculta{display:none}
h1{font-size:34px;letter-spacing:.2em;font-weight:800}
h2{font-size:23px;line-height:1.22;font-weight:750}
p{font-size:14.5px;line-height:1.55;color:var(--texto2);max-width:330px}
button{
  font:inherit;font-size:14.5px;font-weight:650;padding:12px 26px;border-radius:11px;
  border:2px solid var(--texto);background:transparent;color:var(--texto);cursor:pointer;
  transition:background .15s,color .15s
}
button:hover{background:var(--texto);color:var(--fundo)}
button.sec{border-color:var(--texto2);color:var(--texto2);font-size:12.5px;padding:9px 18px}

/* ---------- ficha ---------- */
#ficha{width:100%;max-width:310px;border:5px solid var(--moldura);border-radius:14px;
  background:var(--superficie);padding:17px;text-align:left}
#ficha .nome{font-size:20px;font-weight:800;line-height:1.15}
#ficha .sub{font-size:11.5px;color:var(--texto2);letter-spacing:.1em;text-transform:uppercase;margin-top:3px}
#ficha .grade{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px;margin:15px 0}
#ficha .cel{background:rgba(0,0,0,.26);border-radius:8px;padding:8px 6px;text-align:center}
#ficha .cel b{display:block;font-size:19px;font-weight:800}
#ficha .cel span{font-size:9.5px;color:var(--texto2);letter-spacing:.07em;text-transform:uppercase}
#ficha .final{border-top:2px solid var(--moldura);padding-top:11px;font-size:16px;font-weight:750;color:var(--moldura)}
#marca{font-size:12.5px;color:var(--texto2);max-width:320px;line-height:1.5}
#galeria{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;max-width:340px}
.pino{width:9px;height:9px;border-radius:2px;background:rgba(255,255,255,.14)}
.pino.viu{background:var(--dourado)}
</style>
</head>

<div id="palco">
  <div id="identidade"></div>
  <div id="medidores"></div>
  <div id="area">
    <div id="rotE" class="rotulo"></div>
    <div id="rotD" class="rotulo"></div>
    <div id="carta"></div>
  </div>
  <div id="dica"></div>
  <div id="rodape"></div>

  <div class="tela" id="t-inicio">

    <p>Você tem dezessete anos e está na base de um clube.<br>

    <p style="opacity:.65">Quatro medidores. Chegar a zero mata.<br><b>Chegar a cem também.</b></p>
    <button id="b-comeca">Começar</button>
  </div>

  <div class="tela oculta" id="t-fim">
    <div id="ficha"></div>
    <p id="f-texto"></p>
    <p id="marca"></p>
    <div id="galeria"></div>
    <p id="g-conta" style="font-size:11px;letter-spacing:.1em"></p>
    <button id="b-denovo">De novo</button>
  </div>

":"padrao","arquetipo":"pecanha","unico":true,"texto":"Ele abraça antes de falar e chama todo mundo de campeão. Você foi cortado da lista de relacionados e ele não contou.","esquerda":{"rotulo":"Pergunto direto","efeitos":{"forma":7,"diretoria":-7},"flags":[]},"direita":{"rotulo":"Espero ele contar","efeitos":{"diretoria":7,"forma":-3},"flags":[]}},{"id":"treinador_pecanha_02","era":["travessia"],"cargo":"treinador","peso":10,"tipo":"evento","peso_dramatico":"padrao","arquetipo":"pecanha","unico":true,"texto":"Ele te poupou de quatro jogos difíceis seguidos, para te proteger da imprensa. Você está bem fisicamente e fora de ritmo.","esquerda":{"rotulo":"Peço pra jogar","efeitos":{"forma":6,"diretoria":-6},"flags":[]},"direita":{"rotulo":"Aceito a proteção","efeitos":{"diretoria":6,"forma":-6},"flags":[]}},{"id":"treinador_pecanha_03","era":["auge"],"cargo":"treinador","peso":10,"tipo":"evento","peso_dramatico":"padrao","arquetipo":"pecanha","unico":true,"texto":"Ele disse que você é o melhor do grupo, na sua frente, e disse o mesmo para outros dois no mesmo dia. Você soube pelos dois.","esquerda":{"rotulo":"Cobro a verdade","efeitos":{"forma":4,"diretoria":-4,"torcida":4},"flags":[]},"direita":{"rotulo":"Fico com o elogio","efeitos":{"diretoria":4,"torcida":-4,"forma":-4},"flags":[]}},{"id":"treinador_pecanha_04","era":["auge"],"cargo":"treinador","peso":10,"tipo":"evento","peso_dramatico":"padrao","arquetipo":"pecanha","unico":true,"texto":"Ninguém quer decepcionar ele, e por isso ninguém diz que o time não está funcionando. O grupo perdeu cinco das últimas seis.","esquerda":{"rotulo":"Falo com ele","efeitos":{"diretoria":-6,"forma":6},"flags":[]},"direita":{"rotulo":"Deixo como está","efeitos":{"diretoria":6,"forma":-6},"flags":[]}},{"id":"treinador_pecanha_05","era":["declinio"],"cargo":"treinador","peso":11,"tipo":"evento","peso_dramatico":"padrao","arquetipo":"pecanha","unico":true,"texto":"Ele te escalou machucado, contra o parecer médico, porque você pediu. Diz que confia em você mais do que confia no exame.","esquerda":{"rotulo":"Jogo assim mesmo","efeitos":{"torcida":4,"forma":-7},"flags":["jogou_contra_parecer"]},"direita":{"rotulo":"Peço pra não jogar","efeitos":{"forma":4,"torcida":-4,"diretoria":-4},"flags":[]}}],"finais":{"versao":"0.5","_leia":"Fonte única dos finais. finais.md é a versão legível deste arquivo. Regra estrutural: toda família tem exatamente 5 finais — 1 dourado (multi-fator, difícil), 3 condicionais e 1 genérico sem condição. O genérico é sempre o último e é a rede de segurança: nunca pode existir morte sem final.","regras":{"finais_por_familia":5,"dourados_por_familia":"0 ou 1","genericos_por_familia":1,"fatores_minimos_no_dourado":2,"resolucao":"Percorre a família na ordem. O primeiro final cujas condições batem é o escolhido. Finais de contexto têm prioridade acima de qualquer família.","morte_subita":"Cartas de tipo morte_subita têm uma opção que encerra a carreira na hora, independente dos medidores. Regras: (1) a opção fatal tem que estar TELEGRAFADA no texto e no rótulo — o jogador precisa saber que está fazendo uma besteira, a piada é ter feito mesmo assim; (2) nunca as duas opções são fatais; (3) a opção segura nunca é estritamente melhor em medidores, senão a escolha é falsa; (4) chance padrão 1.0 (morte certa); com chance < 1.0 é aposta e precisa de um bloco 'sobrevive' com recompensa grande.","_contrato_do_dourado":"No maximo 2 fatores. No maximo 1 pode ser algo que o jogador PLANEJOU (flag de escolha ou estatistica acumulada); o segundo tem de ser algo que ele ja tem sem ter perseguido — posicao do segundo medidor no instante da morte, era, idade, ou marca de mundo. Taca: no maximo 1, e so onde a taca for o assunto do final. Nunca `mundo` junto de flag planejada: sao dois planos."},"flags_derivadas":{"sem_escandalo":"nenhuma de {investigacao_apostas, laranja, deve_pro_valdir, fundo_comprou_direitos, patrocinio_apostas} ativa","carreira_limpa":"sem_escandalo E nenhuma de {forcou_saida, calou}"},"flags_do_motor":{"jogou_na_europa":"motor: transição para a era Travessia","aposentado_selecao":"motor: idade >= 33 sem convocação há 2 temporadas","contrato_vencido":"motor: contrato chega a 0 sem renovação","lesionado":"motor: recurso oculto lesao > 0","viveu_arco_capitao":"motor: jogador chegou à era Auge com o arco do capitão concluído"},"flags_pendentes":{},"contexto":[{"id":"ctx_dia_certo","nome":"Aposentadoria no dia certo","moldura":"prata","arte":"final_ctx_dia_certo","condicoes":{"era":["legado"],"medidores_entre":{"min":30,"max":80}},"texto":"Você parou antes de alguém pedir, com dois títulos na estante e nenhum medidor no extremo. Equilíbrio sozinho é mediocridade; equilíbrio depois de ter vencido é a coisa mais difícil deste jogo."},{"id":"ctx_um_clube_so","nome":"Camisa 10 de um clube só","moldura":"dourada","arte":"final_ctx_um_clube_so","condicoes":{"era":["legado"],"estatisticas":{"transferencias":{"max":0}}},"texto":"Dezessete anos, um escudo. Você é a última pessoa que vai conseguir fazer isso e todo mundo sabe."},{"id":"ctx_estatua","nome":"Estátua","moldura":"dourada","arte":"final_ctx_estatua","condicoes":{"era":["legado"],"medidores":{"torcida":{"min":80}}},"texto":"Inauguraram o bronze com você presente, o que é constrangedor. Na sua próxima vida ela ainda vai estar lá, e você vai passar por ela sem saber por quê.","efeito_meta":"mundo_tem_estatua"}],"fim_natural":[{"id":"nat_lenda","nome":"O último jogo","moldura":"prata","arte":"final_ctx_dia_certo","condicoes":{"estatisticas":{"titulos":{"min":1}}},"texto":"Você jogou até os trinta e nove, e o corpo e o calendário concordaram no mesmo mês. Teve título, teve noite boa, e teve a sorte rara de escolher o dia."},{"id":"nat_ninguem","nome":"Uma carreira inteira","moldura":"cinza","arte":"final_ctx_base","condicoes":{"estatisticas":{"titulos":{"max":0},"selecoes":{"max":0}}},"texto":"Vinte e dois anos de profissão, nenhum título, nenhuma convocação, e uma casa quitada. É o que acontece com a esmagadora maioria, e ninguém escreve sobre isso."},{"id":"nat_generico","nome":"Fim de linha","moldura":"cinza","arte":"final_corpo_cobrou","condicoes":{},"texto":"Ninguém avisou que aquele era o último. Você soube num sábado de manhã, sem dor nenhuma, olhando a chuteira e sem vontade de calçar."}],"_nota_fim_natural":"Resolve APENAS o fim natural da carreira (idade 39 ou fim do Legado), depois de contexto e antes de qualquer família de medidor. Entrou depois do teste automatizado: sem ele, 42% das carreiras terminavam em 'Sucata', o genérico de FORMA 0, mesmo em jogadores que nunca chegaram perto do zero.","familias":{"forma_0":{"nome":"O corpo cobrou","arte":"final_corpo_cobrou","gatilho":{"medidor":"forma","extremo":0},"finais":[{"id":"forma0_deu_tudo","nome":"Deu tudo o que tinha","moldura":"prata","condicoes":{"flags":["joelho_tratado"],"medidores":{"torcida":{"min":65}}},"texto":"Você cuidou do corpo a vida inteira e ele acabou mesmo assim. Mas acabou depois, e não antes — e isso, no fim, era a única coisa que dava para negociar."},{"id":"forma0_joelho","nome":"Juros do joelho","moldura":"cinza","condicoes":{"flags":["joelho_ignorado"]},"texto":"Aos dezoito você aguentou porque a peneira era em duas semanas. O corpo anotou a data e cobrou com correção monetária."},{"id":"forma0_infiltracao","nome":"A infiltração número quarenta","moldura":"preta","condicoes":{"flags":["infiltracao_cronica"]},"texto":"Faz três anos que você não sente a perna esquerda direito. Ninguém no clube perguntou uma vez sequer."},{"id":"forma0_cedo","nome":"Aos vinte e quatro","moldura":"cinza","condicoes":{"era":["estouro","travessia"]},"texto":"Você ainda estava subindo. Quebrou no meio da escada e não teve nem tempo de virar uma história triste — virou uma nota de rodapé."},{"id":"forma0_generico","nome":"Sucata","moldura":"cinza","condicoes":{},"texto":"Você acorda antes do despertador e o corpo já disse não antes de você pedir qualquer coisa a ele."}]},"forma_100":{"nome":"Passou do ponto","arte":"final_passou_do_ponto","gatilho":{"medidor":"forma","extremo":100},"finais":[{"id":"forma100_dourado","nome":"O corpo que virou método","moldura":"dourada","condicoes":{"flags":["joelho_tratado"],"idade":{"min":32}},"texto":"Você levou o corpo ao limite absoluto sem quebrá-lo e sem virar produto de ninguém. O protocolo tem o seu nome e três gerações vão durar mais por causa dele."},{"id":"forma100_estourado","nome":"Estourado","moldura":"preta","condicoes":{"flags":["treino_dobrado"]},"texto":"O tendão rompeu num treino de terça-feira, sem público, sem câmera e sem ninguém por perto para ouvir o barulho."},{"id":"forma100_maquina","nome":"A máquina","moldura":"cinza","condicoes":{"medidores":{"diretoria":{"min":70}}},"texto":"Otimizaram o seu sono, a sua comida e o seu descanso até o ponto em que não sobrou jogador nenhum ali dentro, só protocolo."},{"id":"forma100_insaciavel","nome":"Insaciável","moldura":"preta","condicoes":{"marca_de_alma":"fome_antiga"},"texto":"A fome que você trouxe da outra vida te fez chegar mais longe e mais rápido. Também não te deixou parar quando era hora."},{"id":"forma100_generico","nome":"À disposição de ninguém","moldura":"cinza","condicoes":{},"texto":"Você está no melhor momento físico da sua vida e não tem mais para quem provar nada. Isso é pior do que parece."}]},"torcida_0":{"nome":"Viraram","arte":"final_viraram","gatilho":{"medidor":"torcida","extremo":0},"finais":[{"id":"torcida0_vilao","nome":"O vilão necessário","moldura":"prata","condicoes":{"flags":["tomou_posicao"],"medidores":{"diretoria":{"min":60}}},"texto":"Eles te odeiam porque você disse o que era e não voltou atrás nenhuma vez. Você sai odiado, com dois títulos e com razão. Dá para sair de jeito pior."},{"id":"torcida0_cercado","nome":"O carro cercado","moldura":"preta","condicoes":{"flags":["encarou_organizada"]},"texto":"Eles disseram que sabiam onde você almoçava. Sabiam mesmo, e não era ameaça, era aviso."},{"id":"torcida0_mercenario","nome":"Mercenário","moldura":"cinza","condicoes":{"estatisticas":{"transferencias":{"min":4}}},"texto":"Cinco escudos beijados na frente de cinco arquibancadas diferentes. Nenhuma acreditou, e no fim você também não."},{"id":"torcida0_estrangeiro","nome":"Estrangeiro em casa","moldura":"cinza","condicoes":{"flags":["foi_pro_golfo"]},"texto":"Você sumiu por três anos num campeonato que ninguém assiste. Quando voltou, tinham te esquecido de um jeito educado e definitivo."},{"id":"torcida0_generico","nome":"Persona non grata","moldura":"cinza","condicoes":{},"texto":"Pararam de xingar. Levou um tempo até você entender que isso é muito pior do que quando xingavam."}]},"torcida_100":{"nome":"Não é mais seu","arte":"final_nao_e_mais_seu","gatilho":{"medidor":"torcida","extremo":100},"finais":[{"id":"torcida100_dourado","nome":"O nome do estádio","moldura":"dourada","condicoes":{"flags":["escolheu_o_filho"],"era":["declinio","legado"]},"texto":"Você virou o clube inteiro e mesmo assim continuou sendo uma pessoa, porque um dia trocou um jogo por um aniversário. É o único jeito de a idolatria não esmagar ninguém."},{"id":"torcida100_refem","nome":"Refém do ídolo","moldura":"cinza","condicoes":{"flags":["gol_da_final"]},"texto":"Depois daquele gol você não pode sair, não pode errar e não pode envelhecer. Ninguém combinou isso com você."},{"id":"torcida100_gesso","nome":"Santo de gesso","moldura":"cinza","condicoes":{"flags":["tomou_posicao"]},"texto":"Transformaram você em bandeira, e bandeira não escolhe o vento nem o dia em que sai do armário."},{"id":"torcida100_cedo","nome":"A estátua antes da hora","moldura":"cinza","condicoes":{"idade":{"max":29}},"texto":"Inauguraram o seu busto e você tem vinte e nove anos. O que se faz depois disso, exatamente?"},{"id":"torcida100_generico","nome":"Bandeira","moldura":"cinza","condicoes":{},"texto":"Todo mundo tem uma opinião sobre você e nenhuma delas é sobre futebol."}]},"diretoria_0":{"nome":"Fora dos planos","arte":"final_fora_dos_planos","gatilho":{"medidor":"diretoria","extremo":0},"finais":[{"id":"diretoria0_porta_da_frente","nome":"Saiu pela porta da frente","moldura":"prata","condicoes":{"flags":["recusou_apostas"],"medidores":{"torcida":{"min":60}}},"texto":"O clube te descartou e descobriu tarde demais que você não precisava dele. Você enfrentou quem te sugava, recusou o dinheiro fácil, e sai sem dever favor a ninguém."},{"id":"diretoria0_encostado","nome":"Encostado","moldura":"cinza","condicoes":{"flags":["atrito_tecnico"]},"texto":"Seu armário continua lá com o seu nome na etiqueta. A escalação não tem seu nome há catorze meses."},{"id":"diretoria0_filho","nome":"A rescisão que você pediu","moldura":"prata","condicoes":{"flags":["escolheu_o_filho"]},"texto":"Você trocou o resto da carreira por um sábado à tarde. Foi o melhor sábado da sua vida e você faria de novo."},{"id":"diretoria0_queimado","nome":"Queimado no mercado","moldura":"preta","condicoes":{"flags":["forcou_saida"]},"texto":"Você treinou mal de propósito uma vez, há seis anos. Todo diretor esportivo do continente ficou sabendo em uma semana."},{"id":"diretoria0_generico","nome":"Sem clube","moldura":"cinza","condicoes":{},"texto":"O telefone toca bastante. Nunca é sobre você."}]},"diretoria_100":{"nome":"Deixou de ser gente","arte":"final_deixou_de_ser_gente","gatilho":{"medidor":"diretoria","extremo":100},"finais":[{"id":"diretoria100_dourado","nome":"De olhos abertos","moldura":"dourada","condicoes":{"flags":["curso_de_treinador"],"era":["legado"]},"texto":"Você virou instituição sabendo exatamente o preço e assinou mesmo assim, porque queria a chave do alojamento. A base tem cama nova e ninguém sabe que foi você."},{"id":"diretoria100_patrimonio","nome":"Patrimônio do clube","moldura":"cinza","condicoes":{"flags":["contrato_longo"]},"texto":"Renovaram por mais cinco anos e comunicaram você depois, junto com a imprensa, no mesmo parágrafo."},{"id":"diretoria100_propaganda","nome":"O garoto-propaganda","moldura":"cinza","condicoes":{"flags":["calou"]},"texto":"Você aparece em toda campanha institucional e não decide mais nada, nem o horário do próprio almoço."},{"id":"diretoria100_marca","nome":"Filho do clube","moldura":"cinza","condicoes":{"marca_de_alma":"filho_do_clube"},"texto":"Você nasceu devendo lealdade a um escudo que não escolheu. Duas vidas seguidas, o mesmo escudo."},{"id":"diretoria100_generico","nome":"Institucional","moldura":"cinza","condicoes":{},"texto":"Você virou uma sala com o seu nome na porta e uma foto sua de vinte e três anos na parede."}]},"dinheiro_0":{"nome":"Acabou","arte":"final_acabou","gatilho":{"medidor":"dinheiro","extremo":0},"finais":[{"id":"dinheiro0_dourado","nome":"Quebrado e limpo","moldura":"dourada","condicoes":{"flags":["recusou_apostas"],"medidores":{"torcida":{"min":70}}},"texto":"Você recusou todos os atalhos, brigou na justiça com quem te roubava e perdeu. Não sobrou dinheiro nenhum. Sobrou o nome, que era exatamente o que estava em jogo."},{"id":"dinheiro0_posto","nome":"O posto do primo","moldura":"preta","condicoes":{"flags":["deve_pro_valdir"]},"texto":"O dinheiro foi para um negócio que o Valdir jurava. O primo dele sumiu junto com a razão social."},{"id":"dinheiro0_penhora","nome":"Penhora","moldura":"preta","condicoes":{"flags":["familia_perto"]},"texto":"Levaram a casa que você comprou para a sua mãe. Ela não perguntou nada e é por isso que dói."},{"id":"dinheiro0_laranja","nome":"A dívida que não era sua","moldura":"preta","condicoes":{"flags":["laranja"]},"texto":"Vinte e duas empresas no seu CPF, e a execução chegou em todas ao mesmo tempo."},{"id":"dinheiro0_generico","nome":"Quebrado","moldura":"cinza","condicoes":{},"texto":"Você joga pelo que der, onde der, e ainda assim não fecha o mês."}]},"dinheiro_100":{"nome":"A ganância","arte":"final_ganancia","gatilho":{"medidor":"dinheiro","extremo":100},"finais":[{"id":"dinheiro100_clube_comprado","nome":"O clube que você comprou","moldura":"prata","condicoes":{"flags":["recusou_apostas"],"medidores":{"torcida":{"min":60}}},"texto":"Você usou tudo para comprar o clube que te formou. O alojamento tem chuveiro quente, a goteira acabou e o seu nome não está em lugar nenhum do prédio."},{"id":"dinheiro100_processo","nome":"O nome no processo","moldura":"preta","condicoes":{"flags":["investigacao_apostas"]},"texto":"Você respondeu a um palpite com uma risada. A risada estava gravada e a gravação tinha data."},{"id":"dinheiro100_laranja","nome":"Laranja","moldura":"preta","condicoes":{"flags_qualquer":["laranja","fundo_comprou_direitos"]},"texto":"Você era o CPF de um esquema que nunca foi seu, e o dono de quarenta por cento de um jogador que também não era você."},{"id":"dinheiro100_casa_caiu","nome":"A casa caiu","moldura":"preta","condicoes":{"flags":["patrocinio_apostas"],"sem_flags":["rompeu_apostas"]},"texto":"O aplicativo sumiu com o dinheiro de quatrocentas mil pessoas num domingo. O rosto na fachada, no metrô e na camisa era o seu."},{"id":"dinheiro100_generico","nome":"Rico e aposentado aos trinta","moldura":"cinza","condicoes":{},"texto":"Você contou o dinheiro e a conta fechou. A fome não voltou mais, e você passa o resto da vida tentando lembrar como era."}]}},"mortes_subitas":[{"id":"morte_peneira","nome":"A intoxicação mais cara do futebol brasileiro","moldura":"preta","arte":"final_morte_burra","texto":"Churrasco de família na véspera da peneira decisiva. Você passou a manhã do teste no banheiro do posto e o olheiro esperou vinte minutos."},{"id":"morte_apito","nome":"O empurrão","moldura":"preta","arte":"final_morte_banido","texto":"Final do sub-20, pênalti inexistente, e a sua mão no peito do árbitro. Cento e oitenta dias de suspensão, e nenhum clube espera cento e oitenta dias por um garoto de dezoito anos."},{"id":"morte_tatuagem","nome":"A tatuagem","moldura":"preta","arte":"final_morte_burra","texto":"Aposta perdida no vestiário, escudo do rival tatuado na canela, foto na internet em duas horas. A torcida não perdoou, e o clube usou isso para não renovar."},{"id":"morte_carro","nome":"Vinte por hora","moldura":"preta","arte":"final_morte_burra","texto":"Você bateu o carro novo num poste a vinte por hora, no estacionamento do próprio clube, na frente do departamento de marketing inteiro. O joelho não perdoou o ângulo."},{"id":"morte_procuracao","nome":"A procuração","moldura":"preta","arte":"final_morte_burra","texto":"Você assinou uma procuração em branco porque estava com pressa. Quando quis jogar de novo, descobriu que não era mais o dono de nada seu, inclusive do seu nome."},{"id":"morte_live","nome":"A live que ficou salva","moldura":"preta","arte":"final_morte_banido","texto":"Três da manhã, você falando o que pensa do presidente do clube, e a live esquecida ligada por quarenta minutos. A gravação circulou antes do café da manhã."},{"id":"morte_var","nome":"Trezentos e sessenta dias","moldura":"preta","arte":"final_morte_banido","texto":"Você quebrou o monitor do VAR com a mão fechada, em rede nacional. A federação foi criativa na dosimetria e você tinha trinta e um anos."},{"id":"morte_helicoptero","nome":"O helicóptero","moldura":"preta","arte":"final_morte_burra","texto":"Festa a quatrocentos quilômetros na véspera da final, ida e volta de helicóptero. O pouso de emergência num campo de várzea rendeu quarenta milhões de visualizações e três fraturas."},{"id":"morte_selecao","nome":"O áudio de trinta e sete segundos","moldura":"preta","arte":"final_morte_banido","texto":"Você recusou a convocação por áudio, às pressas, com sinceridade. O áudio vazou em trinta e sete segundos de uma franqueza que nenhuma assessoria conseguiu explicar."},{"id":"morte_aposta","nome":"Duzentos reais","moldura":"preta","arte":"final_morte_banido","texto":"Uma aposta, no próprio jogo, de duzentos reais, para provar um ponto numa discussão de vestiário. Banimento vitalício custa exatamente duzentos reais."},{"id":"morte_van","nome":"Duzentos metros","moldura":"preta","arte":"final_morte_burra","texto":"Você desceu na pista para comprar salgado e a van da base voltou sem você. O laudo diz caminhão; o clube disse acidente; o coordenador disse que avisou."},{"id":"morte_pelada","nome":"Campo de terra, coturno, véspera","moldura":"preta","arte":"final_morte_burra","texto":"Um zagueiro de coturno na véspera do jogo pelo sub-17. A perna quebrou em dois lugares e a rua inteira ficou olhando, calada, porque todo mundo entendeu na hora."},{"id":"morte_estudio","nome":"Bicicleta na piscina de bolinhas","moldura":"preta","arte":"final_morte_burra","texto":"Bicicleta de terno, ao vivo, numa piscina de bolinhas de estúdio. A queda foi de costas, o áudio pegou o som, e o vídeo tem mais visualizações que a sua estreia."},{"id":"morte_garupa","nome":"Mil cilindradas, três da manhã","moldura":"preta","arte":"final_morte_burra","texto":"Marginal vazia, sem capacete sobrando, e ele acelerando para te mostrar o que a moto fazia. Ela fez. Duas carreiras acabaram na mesma curva e só uma virou notícia."},{"id":"morte_frio","nome":"Menos oito graus não negociam","moldura":"preta","arte":"final_morte_burra","texto":"Treino de manga curta a menos oito porque manga comprida era frescura. A pneumonia levou seis semanas e o clube levou quatro para te devolver ao time de reservas."},{"id":"morte_fronteira","nome":"Onze dias vencido","moldura":"preta","arte":"final_morte_burra","texto":"O visto tinha onze dias de vencido e o ônibus do amistoso passava a fronteira. Você foi detido às cinco da manhã e liberado com proibição de reentrada por cinco anos."},{"id":"morte_mar","nome":"Conheço o mar","moldura":"preta","arte":"final_morte_burra","texto":"Jet ski alugado sem instrução, mar aberto, ela pedindo para você não ir longe. Acharam o jet ski antes de acharem você, e o resgate foi manchete por três dias."},{"id":"morte_infiltracao","nome":"Quem aplica atende à noite","moldura":"preta","arte":"final_morte_burra","texto":"A fisioterapeuta disse não. Você foi procurar quem dizia sim e ele atendia à noite, num consultório sem placa. A infecção entrou no osso e o joelho não voltou."},{"id":"morte_capsula","nome":"Quatro quilos em três dias","moldura":"preta","arte":"final_morte_burra","texto":"A cápsula resolveu os quatro quilos e apareceu no exame antidoping da rodada seguinte. Dois anos de suspensão aos trinta e dois anos são a mesma coisa que o fim."},{"id":"morte_despedida","nome":"O estádio cheio que você escolheu","moldura":"preta","arte":"final_morte_burra","texto":"Você marcou a própria despedida enquanto ainda vendia ingresso. Foi bonito, foi lotado, e no dia seguinte você acordou aos trinta e dois anos sem ter para onde ir."},{"id":"morte_veterano","nome":"O lateral de vinte e dois","moldura":"preta","arte":"final_morte_burra","texto":"Jogo de veterano, gramado pesado, um lateral querendo aparecer numa carreira que já tinha acabado. O tendão rompeu num jogo que não valia nada e doeu como se valesse."},{"id":"morte_ultimos_quinze","nome":"Os últimos quinze minutos","moldura":"preta","arte":"final_morte_burra","texto":"Oito meses sem entrar e você pediu os quinze minutos finais de um jogo perdido. O músculo cedeu na primeira arrancada, na frente de todos, e ninguém soube o que dizer."},{"id":"morte_colo","nome":"Quarenta mil pessoas e um gramado encharcado","moldura":"preta","arte":"final_morte_burra","texto":"Eles quiseram te carregar no colo do meio do campo até a arquibancada. Alguém escorregou, a queda foi de nuca, e a homenagem virou a última coisa que aconteceu."},{"id":"morte_chuteira_velha","nome":"A chuteira da estreia","moldura":"preta","arte":"final_morte_burra","texto":"Dezoito anos depois, a mesma chuteira, o mesmo pé. A trava cedeu na primeira mudança de direção e o joelho girou de um jeito que não gira. Último treino, mesmo."}],"_nota_dia_certo":"Ganhou a exigência de 2 títulos depois do teste automatizado: sem ela, um jogador que só mantivesse os quatro medidores perto de 50 levava o final dourado mais difícil em 99% das carreiras. Títulos exigem FORMA alta, o que conflita com ficar em 50 — é a tensão que faltava.","escolhas_de_vida":[{"id":"vida_faculdade","nome":"Passou em primeira chamada","moldura":"verde","arte":"final_outra_vida","texto":"Você entrou na sala da prova com a chuteira na mochila e não foi ao teste. Cinco anos depois, engenheiro, jogando bola de sábado no campo da firma — e melhor do que todo mundo lá. Sua mãe pegou dois ônibus para a formatura também."},{"id":"vida_oficina","nome":"A oficina do seu tio","moldura":"verde","arte":"final_outra_vida","texto":"Você trocou a base pela oficina, e em três anos era sua. Hoje tem quatro funcionários, um deles joga na várzea e diz que você tinha talento. Você concorda, sem amargura nenhuma, e volta a mexer no motor."},{"id":"vida_voltou_pra_casa","nome":"Voltou antes de precisar voltar","moldura":"verde","arte":"final_outra_vida","texto":"Rescindiu no meio do contrato, atravessou o Atlântico com duas malas e chegou em casa numa terça à tarde. Ninguém entendeu. Sua mãe entendeu. Você jogou por times pequenos até os trinta e dormiu em casa todas as noites."},{"id":"vida_tv","nome":"O microfone do outro lado","moldura":"verde","arte":"final_outra_vida","texto":"Aos vinte e oito, no melhor momento, você aceitou o contrato da TV e nunca mais jogou. Vinte anos de estúdio, opinião respeitada, sábado livre. De vez em quando alguém pergunta se não dói ter parado ali — e não dói."},{"id":"vida_parou_a_tempo","nome":"Andando normal aos cinquenta","moldura":"verde","arte":"final_outra_vida","texto":"O médico disse que mais uma temporada custava a sua caminhada aos cinquenta. Você parou naquela semana, sem despedida e sem estádio cheio. Aos cinquenta você caminha, joga com o seu filho e sobe escada sem pensar."},{"id":"vida_escolinha","nome":"A escolinha do bairro","moldura":"verde","arte":"final_outra_vida","texto":"Recusou o cargo no clube e abriu uma escolinha na rua onde você aprendeu. Nenhum dos seus meninos virou profissional em dez anos, e os cento e quarenta que passaram por lá sabem o seu nome. É o suficiente e você sabe que é."}],"_nota_escolhas":"Finais que não são morte nem aposentadoria: são ESCOLHA. O jogador sai do futebol por vontade própria, no meio de um fio curto, e o final é bom — só não é de jogador. Moldura verde: não é derrota, é outra vida. São o que faz o jogador entender, na primeira era, que as decisões dele mudam o destino da carreira e não só o número na barra.","familias_precoces":{"forma_0":{"id":"precoce_forma_0","nome":"Cansado aos dezoito","moldura":"cinza","arte":"final_precoce_forma_0","texto":"Ninguém explicou que o corpo de dezessete anos também tem limite. Você chegou ao teste do profissional andando devagar, e o olheiro anotou isso antes de anotar o seu nome."},"forma_100":{"id":"precoce_forma_100","nome":"Treinou até sobrar","moldura":"cinza","arte":"final_precoce_forma_100","texto":"Você treinou mais que todos e ficou pronto para um jogo que não veio. Aos dezoito, o corpo estava no ponto máximo e a paciência do clube já tinha passado do dela."},"torcida_0":{"id":"precoce_torcida_0","nome":"Marcado no vestiário","moldura":"cinza","arte":"final_precoce_torcida_0","texto":"O grupo decidiu antes da comissão. Quando o coordenador foi perguntar sobre você, dez respostas iguais já estavam prontas, e nenhuma era sobre futebol."},"torcida_100":{"id":"precoce_torcida_100","nome":"Fenômeno da base","moldura":"cinza","arte":"final_precoce_torcida_100","texto":"Três vídeos, quatrocentos mil visualizações e uma reportagem antes da primeira partida como profissional. Você virou promessa nacional sem nunca ter sido jogador, e promessa tem prazo."},"diretoria_0":{"id":"precoce_diretoria_0","nome":"Dispensado","moldura":"cinza","arte":"final_precoce_diretoria_0","texto":"A lista saiu numa quinta-feira, impressa, colada na porta do vestiário. Seu nome estava na coluna da direita, e ninguém do clube te procurou depois — nem para explicar, nem para desejar sorte."},"diretoria_100":{"id":"precoce_diretoria_100","nome":"O afilhado","moldura":"cinza","arte":"final_precoce_diretoria_100","texto":"O clube gostava tanto de você que te protegeu de tudo, inclusive de jogar. Saiu da base com três anos de elogio no relatório e nenhum minuto em campo que alguém lembre."},"dinheiro_0":{"id":"precoce_dinheiro_0","nome":"A passagem que faltou","moldura":"cinza","arte":"final_precoce_dinheiro_0","texto":"Dois ônibus por dia, duas horas cada, e um mês em que não deu. Você faltou quatro treinos por falta de troco e o clube registrou como desinteresse."},"dinheiro_100":{"id":"precoce_dinheiro_100","nome":"Rico antes de estrear","moldura":"cinza","arte":"final_precoce_dinheiro_100","texto":"Dinheiro cedo demais na mão de quem tinha dezoito anos e ninguém para explicar. Você comprou tudo que quis e parou de querer a única coisa que exigia acordar às seis."},"generico":{"id":"ctx_base","nome":"O que não passou da base","moldura":"cinza","arte":"final_ctx_base","condicoes":{"era":["base"]},"texto":"Dezenove anos. A ficha de carreira sai com todos os campos em branco, e é isso mesmo que acontece com quase todo mundo."}},"_nota_precoces":"FAMÍLIA PRECOCE. Morrer por medidor na era Base devolvia SEMPRE o mesmo final: 'O que não passou da base' estava no bloco contexto, que resolverFinal consulta antes das famílias, e a condição dele era só era=base. Medido em 2.000 carreiras: 44,5% de TODAS terminavam nessa tela. A ordem contexto-antes-de-família está certa (um garoto de 17 não pode receber 'Santo de gesso'); o erro era a Base ter um final só. Agora tem oito, um por medidor e extremo, e o antigo virou o genérico de quando nenhum casa."},"cargos":{"versao":"1.0","_leia":"Fonte única do elenco. O jogo não tem personagens, tem CARGOS — funções dramáticas que existem em toda vida. Quem ocupa o cargo muda (ou não) conforme a persistência. As cartas são escritas contra o cargo e usam o token {nome} onde precisam citar a pessoa. cargos.md é a versão legível deste arquivo. BARALHO COMPLETO: as cotas refletem o conteúdo escrito.","persistencias":{"eterno":"A MESMA pessoa em todas as vidas. Não envelhece, não muda, não é sorteada. São as duas pistas da reencarnação — e o fato de serem só duas é o que as torna assustadoras.","rotativo":"Pessoa nova a cada vida, sorteada do elenco, nunca repetindo a da vida anterior. O cargo continua; a pessoa não.","intimo":"Pessoa nova a cada vida porque VOCÊ é uma pessoa nova. Outra mãe, outra companheira, outro filho. Não é sorteio de elenco: é consequência de ter renascido.","institucional":"Nunca foi uma pessoa. Não muda porque não é gente."},"tokens_de_texto":{"{nome}":"nome da instância ativa do cargo naquela vida","{apelido}":"apelido do jogador naquela vida — usado pelo roupeiro e pela imprensa"},"eras_alvo":{"_leia":"Cartas consumidas por carreira em cada era (GDD §3). O baralho elegível precisa ser folgado em relação a isso, senão a repetição fica visível. Regra: elegíveis >= 2x o consumo máximo.","base":{"min":16,"max":20},"estouro":{"min":20,"max":24},"travessia":{"min":26,"max":32},"auge":{"min":26,"max":32},"declinio":{"min":24,"max":30},"legado":{"min":10,"max":14}},"cargos":{"empresario":{"nome_do_cargo":"O empresário","persistencia":"eterno","cota_comum":24,"eras":["base","estouro","travessia","auge","declinio","legado"],"quer_de_voce":"percentual, e depois disso gratidão","tensao":["dinheiro","diretoria"],"voz":["fala de você na terceira pessoa com você na frente","nunca termina uma frase com não","usa nós quando é lucro e você quando é problema"],"cor":"#C89B3C","elenco":[{"id":"valdir","nome":"Valdir","idade":46,"retrato":"camisa social por dentro da calça, corrente grossa por fora do colarinho, celular na mão esquerda, sorriso que não chega nos olhos","nota":"A corrente é idêntica em todas as vidas. É a primeira pista que o jogador atento percebe."}]},"roupeiro":{"nome_do_cargo":"O roupeiro","persistencia":"eterno","cota_comum":14,"eras":["base","estouro","travessia","auge","declinio"," ,{"id":"o_vendido","nome":"O Vendido","desc":"quarenta por cento de você tem outro dono","condicoes":{"flags":["fundo_comprou_direitos","patrocinio_apostas"]},"apelido":"Ações"},{"id":"o_embaixador","nome":"O Embaixador","desc":"três posts por mês e o valor do seu salário anual","condicoes":{"flags":["patrocinio_apostas"]},"apelido":"Banca"},{"id":"o_padrinho","nome":"O Padrinho","desc":"ensinou tudo a quem veio ocupar a sua vaga","condicoes":{"flags":["padrinho_do_kaique"]},"apelido":"Tio"},{"id":"a_voz","nome":"A Voz","desc":"falou quando o microfone chegou e ninguém pediu","condicoes":{"flags":["tomou_posicao"],"semFlags":["calou"]},"apelido":"Microfone"},{"id":"o_profissional","nome":"O Profissional","desc":"nunca disse uma frase que precisasse de assessoria","condicoes":{"flags":["calou"],"medidores":{"diretoria":{"min":62}}},"apelido":"Protocolo"},{"id":"o_indestrutivel","nome":"O Indestrutível","desc":"joga com dor há tanto tempo que não lembra do contrário","condicoes":{"flags":["joelho_ignorado","infiltracao_cronica"]},"apelido":"Ferro"},{"id":"o_teimoso","nome":"O Teimoso","desc":"treina dobrado desde os dezessete e nunca contou a ninguém","condicoes":{"flags":["treino_dobrado"]},"apelido":"Dobradinha"},{"id":"o_profissional_do_corpo","nome":"O Método","desc":"cuidou do joelho quando ninguém cuidava do próprio","condicoes":{"flags":["joelho_tratado"],"semFlags":["joelho_ignorado"],"idade":{"min":24}},"apelido":"Método"},{"id":"o_ingrato","nome":"O Ingrato","desc":"processou quem te descobriu","condicoes":{"flags":["processou_valdir"]},"apelido":"Processo"},{"id":"o_dono_do_proprio_nome","nome":"O Dono do Próprio Nome","desc":"negocia sozinho e assina sozinho","condicoes":{"flags":["rompeu_valdir","recusou_fundo"]},"apelido":"Caneta"},{"id":"o_pai","nome":"O Pai","desc":"faltou a um jogo por um aniversário de nove anos","condicoes":{"flags":["escolheu_o_filho"]},"apelido":"Sábado"},{"id":"o_de_casa","nome":"O de Casa","desc":"nunca vestiu outra camisa e rec
